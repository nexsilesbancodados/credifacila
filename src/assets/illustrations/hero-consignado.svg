<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 500" fill="none">
  <defs>
    <linearGradient id="hcs-gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f3c969"/>
      <stop offset="1" stop-color="#b8860b"/>
    </linearGradient>
    <radialGradient id="hcs-glow" cx="0.5" cy="0.5" r="0.6">
      <stop offset="0" stop-color="#daa520" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#daa520" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Halo -->
  <circle cx="300" cy="250" r="240" fill="url(#hcs-glow)"/>

  <!-- Decorative rings -->
  <circle cx="300" cy="250" r="200" fill="none" stroke="url(#hcs-gold)" stroke-opacity="0.35" stroke-width="1" stroke-dasharray="2 6"/>
  <circle cx="300" cy="250" r="155" fill="none" stroke="url(#hcs-gold)" stroke-opacity="0.55" stroke-width="1"/>

  <!-- Document/contract -->
  <g transform="translate(170 130)">
    <rect width="180" height="220" rx="10" fill="#1a1410" stroke="url(#hcs-gold)" stroke-width="1.5"/>
    <rect x="14" y="22" width="120" height="6" rx="2" fill="url(#hcs-gold)"/>
    <rect x="14" y="42" width="80" height="4" rx="2" fill="#daa520" fill-opacity="0.4"/>
    <!-- Lines -->
    <g fill="#daa520" fill-opacity="0.3">
      <rect x="14" y="68" width="152" height="3" rx="1.5"/>
      <rect x="14" y="78" width="140" height="3" rx="1.5"/>
      <rect x="14" y="88" width="148" height="3" rx="1.5"/>
      <rect x="14" y="98" width="120" height="3" rx="1.5"/>
    </g>
    <!-- Highlight box: APROVADO -->
    <g transform="translate(14 120)">
      <rect width="152" height="40" rx="6" fill="url(#hcs-gold)"/>
      <text x="76" y="18" text-anchor="middle" fill="#1a1410" font-family="sans-serif" font-size="9" font-weight="700" letter-spacing="2">CONSIGNADO</text>
      <text x="76" y="32" text-anchor="middle" fill="#1a1410" font-family="sans-serif" font-size="13" font-weight="800">R$ 25.000,00</text>
    </g>
    <!-- Stamp APROVADO -->
    <g transform="translate(120 175) rotate(-12)">
      <rect x="-30" y="-12" width="60" height="24" rx="3" fill="none" stroke="#daa520" stroke-width="2"/>
      <text y="4" text-anchor="middle" fill="#daa520" font-family="sans-serif" font-size="10" font-weight="800" letter-spacing="2">APROVADO</text>
    </g>
    <!-- Signature line -->
    <line x1="14" y1="200" x2="100" y2="200" stroke="#daa520" stroke-opacity="0.6" stroke-width="1"/>
    <text x="14" y="212" fill="#daa520" fill-opacity="0.5" font-family="sans-serif" font-size="7" font-weight="600">ASSINADO DIGITALMENTE</text>
  </g>

  <!-- Coin stack on left -->
  <g transform="translate(70 320)">
    <ellipse cx="0" cy="40" rx="40" ry="10" fill="#1a1410" fill-opacity="0.35"/>
    <g>
      <rect x="-32" y="22" width="64" height="14" rx="7" fill="url(#hcs-gold)" stroke="#1a1410" stroke-opacity="0.3" stroke-width="0.5"/>
      <rect x="-32" y="6" width="64" height="14" rx="7" fill="url(#hcs-gold)" stroke="#1a1410" stroke-opacity="0.3" stroke-width="0.5"/>
      <rect x="-32" y="-10" width="64" height="14" rx="7" fill="url(#hcs-gold)" stroke="#1a1410" stroke-opacity="0.3" stroke-width="0.5"/>
      <ellipse cx="0" cy="-10" rx="32" ry="7" fill="#f3c969"/>
      <text y="-7" text-anchor="middle" fill="#1a1410" font-family="serif" font-size="11" font-weight="800">R$</text>
    </g>
  </g>

  <!-- Wallet on right -->
  <g transform="translate(440 290)">
    <rect x="-50" y="-20" width="100" height="60" rx="8" fill="url(#hcs-gold)"/>
    <rect x="-50" y="-20" width="100" height="14" rx="8" fill="#1a1410" fill-opacity="0.25"/>
    <circle cx="38" cy="10" r="6" fill="#1a1410" fill-opacity="0.4"/>
    <!-- Bills -->
    <rect x="-40" y="-30" width="50" height="14" rx="2" fill="#daa520" fill-opacity="0.7"/>
    <rect x="-30" y="-37" width="50" height="14" rx="2" fill="#daa520" fill-opacity="0.5"/>
  </g>

  <!-- Sparkles -->
  <g fill="#daa520">
    <circle cx="100" cy="100" r="3" opacity="0.7"/>
    <circle cx="500" cy="120" r="2.5" opacity="0.6"/>
    <circle cx="60" cy="220" r="2" opacity="0.5"/>
    <circle cx="540" cy="400" r="2.5" opacity="0.5"/>
    <circle cx="300" cy="430" r="2" opacity="0.4"/>
  </g>
</svg>
