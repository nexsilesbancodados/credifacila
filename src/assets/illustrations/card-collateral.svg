<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 280" fill="none">
  <defs>
    <linearGradient id="cc-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1a1410"/>
      <stop offset="1" stop-color="#2a1f17"/>
    </linearGradient>
    <linearGradient id="cc-gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f3c969"/>
      <stop offset="1" stop-color="#b8860b"/>
    </linearGradient>
    <radialGradient id="cc-glow" cx="0.15" cy="0.85" r="0.7">
      <stop offset="0" stop-color="#daa520" stop-opacity="0.4"/>
      <stop offset="0.7" stop-color="#daa520" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="400" height="280" rx="20" fill="url(#cc-bg)"/>
  <rect width="400" height="280" rx="20" fill="url(#cc-glow)"/>

  <!-- House silhouette -->
  <g transform="translate(80 80)">
    <path d="M 0 100 L 0 50 L 70 0 L 140 50 L 140 100 Z" fill="url(#cc-gold)" opacity="0.95"/>
    <rect x="55" y="55" width="30" height="45" fill="#1a1410" opacity="0.7"/>
    <rect x="20" y="65" width="22" height="22" fill="#1a1410" opacity="0.5"/>
    <rect x="98" y="65" width="22" height="22" fill="#1a1410" opacity="0.5"/>
    <!-- Door knob -->
    <circle cx="78" cy="80" r="2" fill="#daa520"/>
  </g>

  <!-- Car silhouette -->
  <g transform="translate(230 130)">
    <rect x="0" y="35" width="130" height="35" rx="8" fill="url(#cc-gold)"/>
    <path d="M 18 35 L 30 12 L 100 12 L 112 35 Z" fill="url(#cc-gold)"/>
    <rect x="32" y="14" width="30" height="20" rx="2" fill="#1a1410" opacity="0.5"/>
    <rect x="68" y="14" width="30" height="20" rx="2" fill="#1a1410" opacity="0.5"/>
    <circle cx="32" cy="72" r="11" fill="#1a1410" stroke="#daa520" stroke-width="2.5"/>
    <circle cx="100" cy="72" r="11" fill="#1a1410" stroke="#daa520" stroke-width="2.5"/>
    <circle cx="32" cy="72" r="4" fill="#daa520"/>
    <circle cx="100" cy="72" r="4" fill="#daa520"/>
  </g>

  <!-- Lock badge -->
  <g transform="translate(40 200)">
    <circle r="22" fill="#daa520" fill-opacity="0.18" stroke="#daa520" stroke-width="1.5"/>
    <path d="M -8 -2 L -8 -8 Q -8 -14 0 -14 Q 8 -14 8 -8 L 8 -2" stroke="#daa520" stroke-width="2.4" fill="none" stroke-linecap="round"/>
    <rect x="-9" y="-2" width="18" height="14" rx="2" fill="#daa520"/>
  </g>

  <!-- Sparkles -->
  <g fill="#daa520">
    <circle cx="370" cy="40" r="2" opacity="0.6"/>
    <circle cx="200" cy="60" r="1.5" opacity="0.5"/>
    <circle cx="370" cy="220" r="1.5" opacity="0.4"/>
  </g>
</svg>
