  <!-- Floating gold coin -->
  <g transform="translate(450 320)">
    <circle r="40" fill="url(#hsec-gold)" stroke="#1a1410" stroke-opacity="0.25" stroke-width="1.5"/>
    <text y="9" text-anchor="middle" fill="#1a1410" font-family="serif" font-size="32" font-weight="800">$</text>
