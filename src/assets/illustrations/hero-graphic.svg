<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" fill="none">
  <defs>
    <linearGradient id="hg-gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f3c969"/>
      <stop offset="1" stop-color="#b8860b"/>
    </linearGradient>
    <radialGradient id="hg-glow" cx="0.5" cy="0.5" r="0.6">
      <stop offset="0" stop-color="#daa520" stop-opacity="0.6"/>
      <stop offset="1" stop-color="#daa520" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <!-- Glow halo -->
  <circle cx="300" cy="300" r="280" fill="url(#hg-glow)"/>
  <!-- Outer ring -->
  <circle cx="300" cy="300" r="220" fill="none" stroke="url(#hg-gold)" stroke-width="1" stroke-opacity="0.4" stroke-dasharray="2 8"/>
  <circle cx="300" cy="300" r="180" fill="none" stroke="url(#hg-gold)" stroke-width="1" stroke-opacity="0.6"/>
  <!-- Smartphone mockup -->
  <g transform="translate(220 180)">
    <rect width="160" height="240" rx="22" fill="#1a1410" stroke="url(#hg-gold)" stroke-width="1.5"/>
    <rect x="6" y="8" width="148" height="180" rx="10" fill="#0d0b0a"/>
    <!-- Status bar -->
    <rect x="60" y="2" width="40" height="8" rx="4" fill="#1a1410"/>
    <!-- Card mockup inside -->
    <g transform="translate(16 30)">
      <rect width="128" height="76" rx="8" fill="url(#hg-gold)"/>
      <rect x="10" y="14" width="38" height="22" rx="3" fill="#1a1410" fill-opacity="0.5"/>
      <text x="10" y="58" fill="#1a1410" font-family="monospace" font-size="9" font-weight="700">•••• 1234</text>
      <text x="10" y="68" fill="#1a1410" fill-opacity="0.7" font-family="sans-serif" font-size="6" font-weight="700" letter-spacing="1">CREDIFÁCIL</text>
    </g>
    <!-- Buttons -->
    <rect x="16" y="120" width="55" height="22" rx="5" fill="#daa520" fill-opacity="0.2"/>
    <rect x="89" y="120" width="55" height="22" rx="5" fill="#daa520" fill-opacity="0.4"/>
    <!-- Stats row -->
    <rect x="16" y="150" width="128" height="32" rx="6" fill="#daa520" fill-opacity="0.08"/>
    <rect x="22" y="158" width="44" height="4" rx="2" fill="#daa520" fill-opacity="0.7"/>
    <rect x="22" y="166" width="62" height="6" rx="2" fill="#daa520"/>
    <!-- Home indicator -->
    <rect x="60" y="220" width="40" height="3" rx="1.5" fill="#daa520" fill-opacity="0.5"/>
  </g>
  <!-- Floating coins -->
  <g transform="translate(120 200)">
    <circle r="34" fill="url(#hg-gold)"/>
    <text y="8" text-anchor="middle" fill="#1a1410" font-family="serif" font-size="22" font-weight="800">$</text>
  </g>
  <g transform="translate(480 380)">
    <circle r="28" fill="url(#hg-gold)" opacity="0.85"/>
    <text y="6" text-anchor="middle" fill="#1a1410" font-family="serif" font-size="18" font-weight="800">R$</text>
  </g>
  <!-- Up arrow chart -->
  <g transform="translate(450 130)" stroke="url(#hg-gold)" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M 0 50 L 20 35 L 35 45 L 55 20"/>
    <path d="M 45 18 L 60 18 L 60 33"/>
  </g>
  <g transform="translate(110 410)" stroke="url(#hg-gold)" stroke-width="2.5" fill="none" stroke-linecap="round">
    <circle cx="20" cy="20" r="20" stroke-opacity="0.4"/>
    <path d="M 12 20 L 18 26 L 28 14"/>
  </g>
  <!-- Sparkles -->
  <g fill="#daa520">
    <circle cx="100" cy="100" r="3" opacity="0.7"/>
    <circle cx="500" cy="200" r="2" opacity="0.6"/>
    <circle cx="80" cy="320" r="2" opacity="0.5"/>
    <circle cx="520" cy="500" r="2" opacity="0.5"/>
  </g>
</svg>
