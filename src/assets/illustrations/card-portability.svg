<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 280" fill="none">
  <defs>
    <linearGradient id="po-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1a1410"/>
      <stop offset="1" stop-color="#2a1f17"/>
    </linearGradient>
    <linearGradient id="po-gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f3c969"/>
      <stop offset="1" stop-color="#b8860b"/>
    </linearGradient>
    <radialGradient id="po-glow" cx="0.5" cy="0.5" r="0.6">
      <stop offset="0" stop-color="#daa520" stop-opacity="0.3"/>
      <stop offset="0.7" stop-color="#daa520" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="400" height="280" rx="20" fill="url(#po-bg)"/>
  <rect width="400" height="280" rx="20" fill="url(#po-glow)"/>

  <!-- Bank A (left) -->
  <g transform="translate(50 90)">
    <rect x="0" y="0" width="100" height="100" rx="10" fill="#daa520" fill-opacity="0.12" stroke="#daa520" stroke-opacity="0.4" stroke-width="1.5"/>
    <rect x="15" y="22" width="70" height="6" rx="2" fill="#daa520" fill-opacity="0.7"/>
    <rect x="20" y="38" width="10" height="40" fill="#daa520" fill-opacity="0.4"/>
    <rect x="38" y="38" width="10" height="40" fill="#daa520" fill-opacity="0.4"/>
    <rect x="55" y="38" width="10" height="40" fill="#daa520" fill-opacity="0.4"/>
    <rect x="73" y="38" width="10" height="40" fill="#daa520" fill-opacity="0.4"/>
    <rect x="10" y="80" width="80" height="6" rx="1" fill="#daa520" fill-opacity="0.5"/>
    <text x="50" y="-8" text-anchor="middle" fill="#daa520" fill-opacity="0.7" font-family="sans-serif" font-size="10" font-weight="700" letter-spacing="2">OUTRO BANCO</text>
  </g>

  <!-- Arrow with glow -->
  <g transform="translate(170 140)">
    <line x1="0" y1="0" x2="60" y2="0" stroke="url(#po-gold)" stroke-width="6" stroke-linecap="round"/>
    <path d="M 50 -10 L 70 0 L 50 10" stroke="url(#po-gold)" stroke-width="6" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="35" cy="0" r="14" fill="#daa520" fill-opacity="0.15"/>
  </g>

  <!-- Bank B (Credifácil — gold) -->
  <g transform="translate(250 90)">
    <rect x="0" y="0" width="100" height="100" rx="10" fill="url(#po-gold)"/>
    <rect x="15" y="22" width="70" height="6" rx="2" fill="#1a1410" fill-opacity="0.7"/>
    <rect x="20" y="38" width="10" height="40" fill="#1a1410" fill-opacity="0.5"/>
    <rect x="38" y="38" width="10" height="40" fill="#1a1410" fill-opacity="0.5"/>
    <rect x="55" y="38" width="10" height="40" fill="#1a1410" fill-opacity="0.5"/>
    <rect x="73" y="38" width="10" height="40" fill="#1a1410" fill-opacity="0.5"/>
    <rect x="10" y="80" width="80" height="6" rx="1" fill="#1a1410" fill-opacity="0.5"/>
    <text x="50" y="-8" text-anchor="middle" fill="#daa520" font-family="sans-serif" font-size="10" font-weight="800" letter-spacing="2">CREDIFÁCIL</text>
  </g>

  <!-- Discount badge -->
  <g transform="translate(200 50)">
    <circle r="22" fill="#daa520"/>
    <text y="4" text-anchor="middle" fill="#1a1410" font-family="sans-serif" font-size="11" font-weight="800">-30%</text>
  </g>
</svg>
