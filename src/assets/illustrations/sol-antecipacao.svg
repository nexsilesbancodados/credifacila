<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 500" fill="none">
  <defs>
    <linearGradient id="sa-gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f3c969"/>
      <stop offset="1" stop-color="#b8860b"/>
    </linearGradient>
    <radialGradient id="sa-glow" cx="0.5" cy="0.5" r="0.55">
      <stop offset="0" stop-color="#daa520" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#daa520" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <circle cx="300" cy="250" r="220" fill="url(#sa-glow)"/>

  <!-- Invoice with pulse waves -->
  <g transform="translate(170 110)">
    <rect width="170" height="240" rx="10" fill="#1a1410" stroke="url(#sa-gold)" stroke-width="1.5"/>
    <text x="14" y="32" fill="url(#sa-gold)" font-family="sans-serif" font-size="10" font-weight="800" letter-spacing="2">FATURA #2026/04</text>
    <line x1="14" y1="42" x2="156" y2="42" stroke="#daa520" stroke-opacity="0.3"/>
    <g fill="#daa520" fill-opacity="0.4">
      <rect x="14" y="56" width="100" height="3" rx="1.5"/>
      <rect x="14" y="68" width="80" height="3" rx="1.5"/>
      <rect x="14" y="80" width="120" height="3" rx="1.5"/>
      <rect x="14" y="92" width="60" height="3" rx="1.5"/>
    </g>
    <!-- Total box -->
    <rect x="14" y="112" width="142" height="50" rx="6" fill="url(#sa-gold)"/>
    <text x="22" y="128" fill="#1a1410" font-family="sans-serif" font-size="9" font-weight="700">TOTAL</text>
    <text x="22" y="150" fill="#1a1410" font-family="sans-serif" font-size="20" font-weight="800">R$ 50.000</text>
    <!-- Vencimento -->
    <text x="14" y="186" fill="#daa520" fill-opacity="0.5" font-family="sans-serif" font-size="8">Vencimento</text>
    <text x="14" y="200" fill="#daa520" font-family="sans-serif" font-size="11" font-weight="700">30/05/2026</text>
    <!-- Antecipa badge -->
    <g transform="translate(85 220)">
      <rect width="70" height="14" rx="7" fill="#daa520" fill-opacity="0.18" stroke="#daa520" stroke-width="0.5"/>
      <text x="35" y="9" text-anchor="middle" fill="#daa520" font-family="sans-serif" font-size="7" font-weight="700">ANTECIPÁVEL</text>
    </g>
  </g>

  <!-- Lightning -->
  <g transform="translate(95 220)">
    <circle r="38" fill="url(#sa-gold)"/>
    <path d="M -6 -16 L -2 -2 L -10 -2 L 2 18 L -2 4 L 8 4 Z" fill="#1a1410"/>
  </g>

  <!-- Cash flow arrow -->
  <g transform="translate(380 240)">
    <path d="M 0 0 Q 60 -50 140 0" stroke="url(#sa-gold)" stroke-width="3" fill="none" stroke-linecap="round" stroke-dasharray="6 6"/>
    <path d="M 130 -8 L 144 0 L 134 12" stroke="url(#sa-gold)" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="70" y="-30" text-anchor="middle" fill="#daa520" font-family="sans-serif" font-size="11" font-weight="700">24h</text>
  </g>

  <!-- Wallet at end -->
  <g transform="translate(525 240)">
    <rect x="-32" y="-20" width="64" height="40" rx="6" fill="url(#sa-gold)"/>
    <rect x="-32" y="-20" width="64" height="10" rx="6" fill="#1a1410" fill-opacity="0.25"/>
    <circle cx="22" cy="6" r="4" fill="#1a1410" fill-opacity="0.5"/>
  </g>

  <!-- Sparkles -->
  <g fill="#daa520">
    <circle cx="80" cy="80" r="2" opacity="0.55"/>
    <circle cx="510" cy="100" r="2" opacity="0.5"/>
    <circle cx="40" cy="320" r="2" opacity="0.5"/>
    <circle cx="540" cy="380" r="2" opacity="0.45"/>
  </g>
</svg>
