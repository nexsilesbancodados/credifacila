<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 500" fill="none">
  <defs>
    <linearGradient id="sl-gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f3c969"/>
      <stop offset="1" stop-color="#b8860b"/>
    </linearGradient>
    <radialGradient id="sl-glow" cx="0.5" cy="0.5" r="0.55">
      <stop offset="0" stop-color="#daa520" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#daa520" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <circle cx="300" cy="250" r="220" fill="url(#sl-glow)"/>

  <!-- Phone with banking app -->
  <g transform="translate(220 90)">
    <rect width="160" height="320" rx="22" fill="#1a1410" stroke="url(#sl-gold)" stroke-width="1.5"/>
    <rect x="6" y="8" width="148" height="280" rx="12" fill="#0d0b0a"/>
    <!-- Notch -->
    <rect x="60" y="2" width="40" height="8" rx="4" fill="#1a1410"/>

    <!-- App content -->
    <g transform="translate(16 22)">
      <!-- Greeting -->
      <text fill="#daa520" font-family="sans-serif" font-size="9" font-weight="600">Olá, João</text>
      <text y="14" fill="#fff" font-family="sans-serif" font-size="10" font-weight="800" letter-spacing="1">CONTA LURI</text>

      <!-- Balance card -->
      <g transform="translate(0 24)">
        <rect width="128" height="68" rx="8" fill="url(#sl-gold)"/>
        <text x="10" y="18" fill="#1a1410" font-family="sans-serif" font-size="7" font-weight="700">SALDO DISPONÍVEL</text>
        <text x="10" y="40" fill="#1a1410" font-family="sans-serif" font-size="20" font-weight="800">R$ 8.420</text>
        <text x="10" y="58" fill="#1a1410" font-family="sans-serif" font-size="7" font-weight="600" opacity="0.7">+R$ 1.200 este mês</text>
      </g>

      <!-- Quick actions -->
      <g transform="translate(0 102)">
        <rect width="38" height="38" rx="8" fill="#daa520" fill-opacity="0.12"/>
        <text x="19" y="22" text-anchor="middle" fill="#daa520" font-family="sans-serif" font-size="10" font-weight="800">PIX</text>
        <text x="19" y="32" text-anchor="middle" fill="#daa520" fill-opacity="0.7" font-family="sans-serif" font-size="5">Transferir</text>
        <rect x="46" width="38" height="38" rx="8" fill="#daa520" fill-opacity="0.12"/>
        <text x="65" y="22" text-anchor="middle" fill="#daa520" font-family="sans-serif" font-size="9" font-weight="800">$</text>
        <text x="65" y="32" text-anchor="middle" fill="#daa520" fill-opacity="0.7" font-family="sans-serif" font-size="5">Crédito</text>
        <rect x="92" width="38" height="38" rx="8" fill="#daa520" fill-opacity="0.12"/>
        <text x="111" y="22" text-anchor="middle" fill="#daa520" font-family="sans-serif" font-size="11" font-weight="800">▣</text>
        <text x="111" y="32" text-anchor="middle" fill="#daa520" fill-opacity="0.7" font-family="sans-serif" font-size="5">Boletos</text>
      </g>

      <!-- Transactions -->
      <g transform="translate(0 152)">
        <text fill="#daa520" fill-opacity="0.5" font-family="sans-serif" font-size="6" font-weight="700" letter-spacing="1">ÚLTIMAS</text>
        <g transform="translate(0 8)">
          <rect width="128" height="22" rx="4" fill="#daa520" fill-opacity="0.06"/>
          <circle cx="14" cy="11" r="6" fill="#daa520" fill-opacity="0.7"/>
          <text x="26" y="9" fill="#fff" font-family="sans-serif" font-size="6" font-weight="700">PIX recebido</text>
          <text x="26" y="17" fill="#daa520" fill-opacity="0.6" font-family="sans-serif" font-size="5">há 2h</text>
          <text x="120" y="14" text-anchor="end" fill="#22c55e" font-family="sans-serif" font-size="7" font-weight="800">+R$ 250</text>
        </g>
        <g transform="translate(0 36)">
          <rect width="128" height="22" rx="4" fill="#daa520" fill-opacity="0.06"/>
          <circle cx="14" cy="11" r="6" fill="#daa520" fill-opacity="0.5"/>
          <text x="26" y="9" fill="#fff" font-family="sans-serif" font-size="6" font-weight="700">Boleto pago</text>
          <text x="26" y="17" fill="#daa520" fill-opacity="0.6" font-family="sans-serif" font-size="5">ontem</text>
          <text x="120" y="14" text-anchor="end" fill="#fff" fill-opacity="0.7" font-family="sans-serif" font-size="7" font-weight="800">-R$ 89</text>
        </g>
        <g transform="translate(0 64)">
          <rect width="128" height="22" rx="4" fill="#daa520" fill-opacity="0.06"/>
          <circle cx="14" cy="11" r="6" fill="#daa520" fill-opacity="0.6"/>
          <text x="26" y="9" fill="#fff" font-family="sans-serif" font-size="6" font-weight="700">Salário</text>
          <text x="26" y="17" fill="#daa520" fill-opacity="0.6" font-family="sans-serif" font-size="5">5 dias</text>
          <text x="120" y="14" text-anchor="end" fill="#22c55e" font-family="sans-serif" font-size="7" font-weight="800">+R$ 4.200</text>
        </g>
      </g>
    </g>

    <!-- Home indicator -->
    <rect x="60" y="296" width="40" height="3" rx="1.5" fill="#daa520" fill-opacity="0.5"/>
  </g>

  <!-- Coins floating -->
  <g transform="translate(120 240)">
    <circle r="28" fill="url(#sl-gold)"/>
    <text y="7" text-anchor="middle" fill="#1a1410" font-family="serif" font-size="18" font-weight="800">$</text>
  </g>
  <g transform="translate(490 350)">
    <circle r="22" fill="url(#sl-gold)" opacity="0.85"/>
    <text y="6" text-anchor="middle" fill="#1a1410" font-family="serif" font-size="14" font-weight="800">R$</text>
  </g>

  <!-- PIX badge -->
  <g transform="translate(125 130)">
    <rect width="60" height="22" rx="4" fill="#22c55e"/>
    <text x="30" y="15" text-anchor="middle" fill="#fff" font-family="sans-serif" font-size="11" font-weight="800" letter-spacing="2">PIX</text>
  </g>

  <!-- Sparkles -->
  <g fill="#daa520">
    <circle cx="80" cy="80" r="2.5" opacity="0.6"/>
    <circle cx="520" cy="100" r="2" opacity="0.5"/>
    <circle cx="80" cy="400" r="2" opacity="0.5"/>
    <circle cx="510" cy="430" r="2" opacity="0.45"/>
  </g>
</svg>
