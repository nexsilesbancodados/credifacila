<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 280" fill="none">
  <defs>
    <linearGradient id="cb-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1a1410"/>
      <stop offset="1" stop-color="#2a1f17"/>
    </linearGradient>
    <linearGradient id="cb-gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f3c969"/>
      <stop offset="1" stop-color="#b8860b"/>
    </linearGradient>
    <radialGradient id="cb-glow" cx="0.85" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#daa520" stop-opacity="0.4"/>
      <stop offset="0.7" stop-color="#daa520" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="400" height="280" rx="20" fill="url(#cb-bg)"/>
  <rect width="400" height="280" rx="20" fill="url(#cb-glow)"/>

  <!-- Building -->
  <g transform="translate(60 60)">
    <rect x="0" y="20" width="150" height="180" fill="url(#cb-gold)"/>
    <!-- floors / windows -->
    <g fill="#1a1410" fill-opacity="0.6">
      <rect x="15" y="40" width="20" height="22"/>
      <rect x="45" y="40" width="20" height="22"/>
      <rect x="75" y="40" width="20" height="22"/>
      <rect x="105" y="40" width="20" height="22"/>
      <rect x="15" y="75" width="20" height="22"/>
      <rect x="45" y="75" width="20" height="22"/>
      <rect x="75" y="75" width="20" height="22"/>
      <rect x="105" y="75" width="20" height="22"/>
      <rect x="15" y="110" width="20" height="22"/>
      <rect x="45" y="110" width="20" height="22"/>
      <rect x="75" y="110" width="20" height="22"/>
      <rect x="105" y="110" width="20" height="22"/>
      <rect x="15" y="145" width="20" height="22"/>
      <rect x="45" y="145" width="20" height="22"/>
      <rect x="75" y="145" width="20" height="22"/>
      <rect x="105" y="145" width="20" height="22"/>
    </g>
    <!-- door -->
    <rect x="60" y="170" width="30" height="30" fill="#1a1410" fill-opacity="0.7"/>
    <!-- antenna/flag -->
    <rect x="73" y="0" width="4" height="20" fill="#daa520"/>
  </g>

  <!-- Growth chart -->
  <g transform="translate(250 90)">
    <!-- bars -->
    <rect x="0" y="80" width="20" height="40" fill="#daa520" fill-opacity="0.5" rx="2"/>
    <rect x="28" y="60" width="20" height="60" fill="#daa520" fill-opacity="0.7" rx="2"/>
    <rect x="56" y="35" width="20" height="85" fill="#daa520" fill-opacity="0.85" rx="2"/>
    <rect x="84" y="10" width="20" height="110" fill="url(#cb-gold)" rx="2"/>
    <!-- arrow -->
    <path d="M 5 90 L 95 25" stroke="url(#cb-gold)" stroke-width="3" stroke-linecap="round"/>
    <path d="M 80 18 L 99 22 L 90 38" stroke="url(#cb-gold)" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- Briefcase -->
  <g transform="translate(305 195)">
    <rect x="-20" y="-15" width="40" height="30" rx="3" fill="url(#cb-gold)"/>
    <rect x="-10" y="-20" width="20" height="8" rx="2" fill="none" stroke="#daa520" stroke-width="1.5"/>
    <rect x="-3" y="-3" width="6" height="3" rx="1" fill="#1a1410"/>
  </g>
</svg>
