<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Credifácil | Crédito Rápido e Seguro</title>
    <meta name="description" content="Crédito rápido, seguro e descomplicado para realizar seus planos. Simule agora e receba em minutos." />
    <meta name="author" content="Credifácil" />

    <meta property="og:title" content="Credifácil | Crédito Rápido e Seguro" />
    <meta property="og:description" content="Crédito rápido, seguro e descomplicado para realizar seus planos." />
    <meta property="og:type" content="website" />
    <meta property="og:image" content="https://lovable.dev/opengraph-image-p98pqg.png" />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:image" content="https://lovable.dev/opengraph-image-p98pqg.png" />

    <style>
      #initial-loader {
        position: fixed;
        inset: 0;
        background: #0d0b0a;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        z-index: 9999;
        transition: opacity 0.4s ease-out, visibility 0.4s;
      }
      .loader-bar-container {
        width: 200px;
        height: 2px;
        background: rgba(255, 255, 255, 0.1);
        border-radius: 4px;
        overflow: hidden;
      }
      .loader-bar {
        height: 100%;
        background: linear-gradient(90deg, #b8860b, #daa520, #ffd700);
        animation: loading 1.6s cubic-bezier(0.4, 0, 0.2, 1) infinite;
      }
      @keyframes loading {
        0% { width: 0%; transform: translateX(-100%); }
        50% { width: 100%; transform: translateX(0); }
        100% { width: 0%; transform: translateX(100%); }
      }
      body.loaded #initial-loader {
        opacity: 0;
        visibility: hidden;
      }
      .scroll-progress-container {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 3px;
        z-index: 10000;
        pointer-events: none;
      }
      .scroll-progress-bar {
        height: 100%;
        width: 0%;
        background: linear-gradient(90deg, #b8860b, #daa520, #ffd700);
        transition: width 0.1s ease-out;
      }
    </style>
  </head>

  <body>
    <div id="initial-loader">
      <div class="loader-bar-container">
        <div class="loader-bar"></div>
      </div>
    </div>
    <div class="scroll-progress-container">
      <div id="scroll-bar" class="scroll-progress-bar"></div>
    </div>
    <div id="root"></div>
    <script>
      window.addEventListener('scroll', () => {
        const winScroll = document.body.scrollTop || document.documentElement.scrollTop;
        const height = document.documentElement.scrollHeight - document.documentElement.clientHeight;
        const scrolled = height > 0 ? (winScroll / height) * 100 : 0;
        const bar = document.getElementById("scroll-bar");
        if (bar) bar.style.width = scrolled + "%";
      }, { passive: true });
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
