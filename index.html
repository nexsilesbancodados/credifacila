<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
     <title>Credifácil | Crédito Rápido e Seguro</title>
     <meta name="description" content="Crédito rápido, seguro e descomplicado para realizar seus planos. Simule agora e receba em minutos." />
     <style>
       #initial-loader {
         position: fixed;
         top: 0;
         left: 0;
         width: 100%;
         height: 100%;
         background: #0d0b0a;
         display: flex;
         flex-direction: column;
         align-items: center;
         justify-content: center;
         z-index: 9999;
         transition: opacity 0.5s ease-out, visibility 0.5s;
       }
       .loader-logo {
         width: 180px;
         margin-bottom: 24px;
         opacity: 0;
         animation: fadeIn 0.8s ease-out forwards;
       }
       .loader-bar-container {
         width: 200px;
         height: 2px;
         background: rgba(255, 255, 255, 0.1);
         border-radius: 4px;
         overflow: hidden;
       }
       .loader-bar {
         width: 0%;
         height: 100%;
         background: linear-gradient(90deg, #b8860b, #daa520, #ffd700);
         animation: loading 2s cubic-bezier(0.4, 0, 0.2, 1) infinite;
       }
       @keyframes fadeIn {
         from { opacity: 0; transform: translateY(10px); }
         to { opacity: 1; transform: translateY(0); }
       }
       @keyframes loading {
         0% { width: 0%; transform: translateX(-100%); }
         50% { width: 100%; transform: translateX(0); }
         100% { width: 0%; transform: translateX(100%); }
       }
       body.loaded #initial-loader {
         opacity: 0;
         visibility: hidden;
       }
     </style>
   </head>
 
   <body>
     <div id="initial-loader">
       <div class="loader-bar-container">
         <div class="loader-bar"></div>
       </div>
     </div>
     <div id="root"></div>
    <meta name="author" content="Lovable" />
