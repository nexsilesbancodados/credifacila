<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#1366E5" />
    <!-- Cache optimized: allowing static asset cache while keeping HTML fresh -->
    <meta http-equiv="Cache-Control" content="no-cache" />
    
    <title>Credifácil | Inteligência Financeira & Crédito Estruturado</title>
    <meta name="description" content="Soluções de crédito consignado, securitização e investimentos para alta performance financeira. Tecnologia e solidez bancária.">
    <meta name="author" content="Credifácil Network" />
    <link rel="canonical" href="https://credifacila.lovable.app/" />

    <meta property="og:type" content="website" />
    <meta property="og:locale" content="pt_BR" />
    <meta property="og:url" content="https://credifacila.lovable.app/" />
    <meta property="og:image" content="https://credifacila.lovable.app/og-image.png">
    <meta property="og:site_name" content="Credifácil" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:image" content="https://credifacila.lovable.app/og-image.png">
    
    <link rel="icon" href="/favicon.png" type="image/png" />
    <link rel="apple-touch-icon" href="/favicon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="dns-prefetch" href="https://fonts.gstatic.com" />
    
    <style>
      :root { color-scheme: dark; }
      html, body { background: #05070A; margin: 0; padding: 0; }
      #initial-loader {
        position: fixed; inset: 0;
        background: #05070A;
        display: flex; flex-direction: column; align-items: center; justify-content: center;
        z-index: 9999;
        transition: opacity .4s ease-out, visibility .4s;
      }
      .loader-mark {
        font-family: system-ui, -apple-system, sans-serif;
        font-weight: 900;
        font-size: 24px;
        letter-spacing: 0.4em;
        color: white;
        margin-bottom: 24px;
        opacity: 0.9;
      }
      .loader-bar-container {
        width: 140px; height: 1px; background: rgba(255,255,255,0.05); overflow: hidden;
      }
      .loader-bar {
        height: 100%; width: 50%;
        background: #E5B25D;
        animation: loading 1.5s ease-in-out infinite;
      }
      @keyframes loading {
        0% { transform: translateX(-150%); }
        100% { transform: translateX(250%); }
      }
      body.loaded #initial-loader { opacity: 0; visibility: hidden; pointer-events: none; }
    </style>
  </head>

  <body>
    <div id="initial-loader" aria-hidden="true">
      <div class="loader-mark">CREDIFÁCIL</div>
      <div class="loader-bar-container"><div class="loader-bar"></div></div>
    </div>
    
    <div id="root"></div>
    
    <script type="module" src="/src/main.tsx"></script>
    <script>
      (function () {
        var root = document.getElementById('root');
        var hide = function () { document.body.classList.add('loaded'); };
        var obs = new MutationObserver(function () {
          if (root && root.childElementCount > 0) { hide(); obs.disconnect(); }
        });
        if (root) obs.observe(root, { childList: true });
        setTimeout(hide, 3000);
      })();
    </script>
  </body>
</html>
