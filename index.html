  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0d0b0a" />

    <meta name="description" content="Crédito pessoal, consignado e empresarial com aprovação em minutos. Simule, contrate online e receba hoje. Mais de 50 mil clientes confiam na Credifácil." />
    <meta name="author" content="Credifácil" />
    <link rel="canonical" href="https://www.credifacil.com.br/" />

    <meta property="og:title" content="Credifácil | Crédito rápido, seguro e descomplicado" />
    <meta property="og:description" content="Aprovação em minutos. Dinheiro na conta hoje. Simule já o seu crédito." />
    <meta property="og:type" content="website" />
    <meta property="og:locale" content="pt_BR" />
    <meta property="og:image" content="/og-image.png" />
    <meta property="og:site_name" content="Credifácil" />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Credifácil | Crédito rápido, seguro e descomplicado" />
    <meta name="twitter:description" content="Aprovação em minutos. Dinheiro na conta hoje." />
    <meta name="twitter:image" content="/og-image.png" />

    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="preload"
      as="style"
      href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;700&family=Plus+Jakarta+Sans:wght@700;800&display=swap"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;700&family=Plus+Jakarta+Sans:wght@700;800&display=swap"
      rel="stylesheet"
      media="print"
      onload="this.media='all'"
    />
    <noscript>
      <link
        href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;700&family=Plus+Jakarta+Sans:wght@700;800&display=swap"
        rel="stylesheet"
      />
    </noscript>

    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "FinancialService",
        "name": "Credifácil",
        "description": "Crédito pessoal, consignado e empresarial 100% online. Aprovação em minutos.",
        "url": "https://www.credifacil.com.br",
        "areaServed": "BR",
        "currenciesAccepted": "BRL",
        "aggregateRating": {
          "@type": "AggregateRating",
          "ratingValue": "4.9",
          "reviewCount": "12000"
        }
      }
    </script>

    <style>
      :root { color-scheme: light; }
      html, body { background: #0d0b0a; }
      #initial-loader {
        position: fixed; inset: 0;
        background: radial-gradient(ellipse at center, #1a1614 0%, #0d0b0a 70%);
        display: flex; flex-direction: column; align-items: center; justify-content: center;
        z-index: 9999;
        transition: opacity .35s ease-out, visibility .35s;
        font-family: "Manrope", system-ui, sans-serif;
      }
      .loader-mark {
        font-family: "Plus Jakarta Sans", "Manrope", system-ui, sans-serif;
        font-weight: 800;
        font-size: 22px;
        letter-spacing: 0.06em;
        background: linear-gradient(135deg, #f3c969 0%, #b8860b 100%);
        -webkit-background-clip: text;
        background-clip: text;
        color: transparent;
        margin-bottom: 18px;
      }
      .loader-bar-container {
        width: 180px; height: 2px; background: rgba(255,255,255,0.08); border-radius: 4px; overflow: hidden;
      }
      .loader-bar {
        height: 100%;
        background: linear-gradient(90deg, transparent, #daa520, #f3c969, #daa520, transparent);
        animation: loading 1.4s cubic-bezier(.4,0,.2,1) infinite;
      }
      @keyframes loading {
        0% { transform: translateX(-100%); }
        100% { transform: translateX(100%); }
      }
      body.loaded #initial-loader { opacity: 0; visibility: hidden; }
      .scroll-progress-container {
        position: fixed; top: 0; left: 0; width: 100%; height: 2px;
        z-index: 10000; pointer-events: none;
      }
      .scroll-progress-bar {
        height: 100%; width: 0%;
        background: linear-gradient(90deg, #b8860b, #daa520, #f3c969);
        transition: width .1s ease-out;
      }
      body { font-family: "Manrope", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
    </style>
  </head>

  <body>
    <div id="initial-loader" aria-hidden="true">
      <div class="loader-mark">CREDIFÁCIL</div>
      <div class="loader-bar-container"><div class="loader-bar"></div></div>
    </div>
    <div class="scroll-progress-container"><div id="scroll-bar" class="scroll-progress-bar"></div></div>
    <div id="root"></div>
    <script>
      var __scrollBar = null;
      window.addEventListener('scroll', function () {
        if (!__scrollBar) __scrollBar = document.getElementById("scroll-bar");
        var winScroll = document.body.scrollTop || document.documentElement.scrollTop;
        var height = document.documentElement.scrollHeight - document.documentElement.clientHeight;
        var scrolled = height > 0 ? (winScroll / height) * 100 : 0;
        if (__scrollBar) __scrollBar.style.width = scrolled + "%";
      }, { passive: true });
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
